
[package]
name = "provenance-nemo-relay"
version = "0.1.0"
edition = "2024"
description = "NeMo Relay ATOF bridge for provenance observation plugins"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nemo-relay-plugin = "=0.8.1"
provenance-core = { path = "../provenance-core" }
provenance-data-model = { path = "../provenance-data-model" }
provenance-plugin = { path = "../provenance-plugin" }
provenance-storage = { path = "../provenance-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
nemo-relay = "=0.8.1"
pollster = "0.4"
tempfile = "3"
wit-component = "0.254"
