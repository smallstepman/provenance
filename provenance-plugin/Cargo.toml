[package]
name = "provenance-plugin"
version = "0.1.0"
edition = "2024"
description = "WASM plugin loading and provenance transaction bridge"
license = "MIT"

[features]
default = []
guest = ["dep:wit-bindgen"]

[dependencies]
provenance-core = { workspace = true }
provenance-data-model = { workspace = true }
wasmtime = { workspace = true }
wit-bindgen = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
wit-component = { workspace = true }
