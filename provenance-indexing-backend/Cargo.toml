[package]
name = "provenance-indexing-backend"
version = "0.1.0"
edition = "2024"

[features]
 default = []
 sqlite = ["dep:rusqlite", "test-support"]
 duckdb = ["dep:duckdb", "test-support"]
 doltlite = ["dep:doltlite", "test-support"]
 turso = ["dep:turso", "dep:pollster", "test-support"]
 lbug = ["dep:lbug", "test-support"]
 redb = ["dep:redb", "test-support"]
 heed = ["dep:heed", "dep:sha2", "test-support"]
 mnestic = ["dep:mnestic", "test-support"]
 test-support = ["dep:tempfile"]

[lib]
name = "provenance_indexing_backend"
path = "src/lib.rs"

[dependencies]
 doltlite = { package = "rusqdoltlite", version = "0.40.17", features = ["bundled"], optional = true }
 duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
 heed = { version = "0.22.1", optional = true }
 lbug = { version = "0.19.1", optional = true }
 mnestic = { version = "0.16.0", default-features = false, features = ["storage-rocksdb"], optional = true }
 pollster = { version = "0.4", optional = true }
 postcard = { version = "1.1", features = ["alloc"] }
 provenance-core = { path = "../provenance-core" }
 redb = { version = "4.2.0", optional = true }
 rusqlite = { version = "0.32", features = ["bundled"], optional = true }
 serde = { version = "1", features = ["derive"] }
 sha2 = { version = "0.10", optional = true }
 tempfile = { version = "3", optional = true }
 thiserror = "2"
 turso = { version = "0.8.0-pre.7", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "backends"
harness = false

