[package]
name = "provenance-indexing-backend"
version = "0.1.0"
edition = "2024"

[features]
default = []
sqlite = ["dep:rusqlite", "test-support"]
duckdb = ["dep:duckdb", "test-support"]
test-support = []

[lib]
name = "provenance_indexing_backend"
path = "src/lib.rs"

[dependencies]
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
postcard = { version = "1.1", features = ["alloc"] }
provenance-core = { path = "../provenance-core" }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3"

[[bench]]
name = "backends"
harness = false

