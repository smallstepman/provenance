[workspace]
members = [
    "provenance-core",
    "provenance-data-model",
    "provenance-jj",
    "provenance-plugin",
    "provenance-plugin/examples/hello",
    "provenance-storage",
    "provenance-plugin/examples/beads",
]
resolver = "3"

[workspace.dependencies]
fs2 = "0.4"
gix = { version = "0.85", default-features = false, features = ["parallel", "sha1", "sha256", "zlib-rs"] }
jj-lib = { version = "0.44", default-features = true }
pollster = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
provenance-core = { path = "provenance-core" }
provenance-data-model = { path = "provenance-data-model" }
provenance-storage = { path = "provenance-storage" }
provenance-plugin = { path = "provenance-plugin" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
wasmtime = { version = "48", default-features = false, features = ["component-model", "cranelift", "runtime", "wat"] }
wit-bindgen = "0.61"
wit-component = "0.254"
