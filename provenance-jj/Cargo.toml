[package]
name = "provenance-jj"
version = "0.1.0"
edition = "2024"

[lib]
name = "provenance_jj"
path = "src/lib.rs"

[dependencies]
provenance-core = { path = "../provenance-core" }
jj-lib = { version = "0.44", default-features = true }
gix = { version = "0.85", default-features = false, features = ["parallel", "sha1", "sha256", "zlib-rs"] }
pollster = "0.4"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
